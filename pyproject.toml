[project]
name = "jobpipe"
version = "0.1.0"
description = "ELT pipeline over public job-board postings: Python extract -> DuckDB + dbt warehouse -> static report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.9,<1.12",
    "duckdb>=1.2,<2",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/srujanmalakpata/jobpipe"

[project.scripts]
pipeline = "jobpipe.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: runs dbt against a temporary DuckDB warehouse built from fixtures (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
