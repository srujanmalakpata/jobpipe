version: 2

models:
  - name: mart_weekly_postings_flow
    description: Postings opened, closed and listed per ISO week.
    columns:
      - name: week_start
        data_tests: [unique, not_null]
      - name: opened
        data_tests:
          - between: {arguments: {min_value: 0, max_value: 1000000}}
      - name: closed
        data_tests:
          - between: {arguments: {min_value: 0, max_value: 1000000}}

  - name: mart_time_to_close
    description: Days from first_seen to closed_at by role family (left-censored excluded).
    columns:
      - name: role_family
        data_tests: [unique, not_null]

  - name: mart_skill_demand
    description: Share of postings mentioning each vocabulary skill, by role family.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [role_family, skill]
    columns:
      - name: share_of_postings
        data_tests:
          - not_null
          - between: {arguments: {min_value: 0, max_value: 1}}
      - name: share_of_open
        data_tests:
          - between: {arguments: {min_value: 0, max_value: 1}}

  - name: mart_remote_share
    description: Remote / hybrid / onsite mix of listed postings per week.
    columns:
      - name: week_start
        data_tests: [unique, not_null]
      - name: remote_share
        data_tests:
          - between: {arguments: {min_value: 0, max_value: 1}}

  - name: mart_entry_level_share
    description: Share of listed postings that are intern / entry level, per week and role family.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [week_start, role_family]
    columns:
      - name: entry_level_share
        data_tests:
          - between: {arguments: {min_value: 0, max_value: 1}}
